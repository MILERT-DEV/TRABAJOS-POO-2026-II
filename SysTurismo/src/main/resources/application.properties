# ============================================================
# Base de datos H2 embebida (archivo ./data/systurismo.mv.db)
# ============================================================
db.url=jdbc:h2:file:./data/systurismo
db.username=sa
db.password=

# ============================================================
# DDL: scripts separados por coma, se ejecutan en cada arranque
# (son idempotentes: usan CREATE TABLE IF NOT EXISTS y MERGE)
# ============================================================
db.ddl.auto=true
db.ddl.script=schema_turismo.sql
